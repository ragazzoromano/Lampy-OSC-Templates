name: PR links an issue

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  check-issue-link:
    runs-on: ubuntu-latest
    steps:
      - name: Require "Closes #N" in the description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if printf '%s' "$PR_BODY" | grep -Eiq '(close[sd]?|fix(e[sd])?|resolve[sd]?)[[:space:]]+#[0-9]+'; then
            echo "Linked issue found."
          else
            echo "::error::Add 'Closes #<issue number>' to the pull request description. Every change needs an accepted issue first."
            exit 1
          fi
